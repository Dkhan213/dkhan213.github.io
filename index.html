<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniel Khan | Engineering Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .portfolio-container {
      width: 100%;
      max-width: 1100px;
    }
    .header {
      margin-bottom: 16px;
      text-align: left;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }
    .header p {
      font-size: 0.95rem;
      color: #94a3b8;
    }
    .slide-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      background-color: #000;
    }
    .slide-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="portfolio-container">
    <div class="header">
      <h1>Daniel Khan</h1>
      <p>Engineering Portfolio</p>
    </div>
    <div class="slide-wrapper">
      <iframe 
        src="https://docs.google.com/presentation/d/e/2PACX-1vTz2Gsq18jqTEo3Zrav0B_l35FZNwdAoI0p2Gbvhin1LY3mnsenr5E1S4t07Q6FUpOWFcT9Caf6tNMr/pubembed?start=false&loop=false&delayms=3000" 
        allowfullscreen="true" 
        mozallowfullscreen="true" 
        webkitallowfullscreen="true">
      </iframe>
    </div>
  </div>
</body>
</html>
